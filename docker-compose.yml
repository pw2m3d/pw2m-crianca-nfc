services:
  mysql:
    image: mysql:8.4
    container_name: pw2m-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pw2m_nfc
      MYSQL_USER: pw2m
      MYSQL_PASSWORD: pw2m_dev
      MYSQL_ROOT_PASSWORD: root_dev_change
    ports:
      - "3306:3306"
    volumes:
      - pw2m_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_change"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pw2m_mysql_data:
