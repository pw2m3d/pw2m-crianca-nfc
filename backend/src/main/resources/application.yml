spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pw2m_nfc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:pw2m}
    password: ${DB_PASSWORD:pw2m_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Apenas desenvolvimento local. Em produção application-prod.yml exige variável.
    secret-base64: ${JWT_SECRET_BASE64:UFcyTS1ORkMtREVWLUpXVC1TRUNSRVQtS0VZLTIwMjYtMDEyMzQ1Njc4OTA=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  api-docs:
    path: /v3/api-docs